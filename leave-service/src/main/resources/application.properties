server.port=${SERVER_PORT:9003}
spring.application.name=leave-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:9007/leave_tracker}
spring.datasource.username=${DB_USERNAME:leave_user}
spring.datasource.password=${DB_PASSWORD:leave_pass}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:9009}
spring.rabbitmq.username=${RABBIT_USERNAME:leave_user}
spring.rabbitmq.password=${RABBIT_PASSWORD:leave_pass}

app.employee-service-url=${EMPLOYEE_SERVICE_URL:http://localhost:9002}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:9005/eureka/}

resilience4j.circuitbreaker.instances.employeeService.sliding-window-size=5
resilience4j.circuitbreaker.instances.employeeService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.employeeService.wait-duration-in-open-state=10s

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://localhost:9010/api/v2/spans}
management.endpoints.web.exposure.include=health,info,circuitbreakers
